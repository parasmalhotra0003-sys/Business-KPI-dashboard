<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BizKPI Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1>📊 BizKPI</h1>
            <p>Sign in to your Business Intelligence Account</p>
        </div>
        
        <div id="login-error" class="login-error"></div>
        
        <form id="login-form">
            <div class="form-group mb-3">
                <label for="username">USERNAME</label>
                <input type="text" id="username" name="username" required placeholder="Enter username">
            </div>
            
            <div class="form-group mb-4">
                <label for="password">PASSWORD</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="login-btn">Sign In</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const errBox = document.getElementById('login-error');
            errBox.style.display = 'none';
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch("{{ url_for('auth.api_login') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                if (result.success) {
                    window.location.href = "{{ url_for('dashboard_view') }}";
                } else {
                    errBox.textContent = result.error || 'Invalid credentials.';
                    errBox.style.display = 'block';
                }
            } catch (err) {
                errBox.textContent = 'Server connection failed.';
                errBox.style.display = 'block';
            }
        };
    </script>
</body>
</html>
