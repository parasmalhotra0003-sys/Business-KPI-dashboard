<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>BizKPI - Business Performance Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside id="sidebar">
        <h2>📊 BizKPI</h2>
        <small>Business Intelligence</small>
        <nav>
            <button class="active" data-page="dashboard">▦ Dashboard</button>
            <button data-page="customers">♟ Customers</button>
            <button data-page="products">▣ Products</button>
            <button data-page="sales">🛒 Sales</button>
            <button data-page="expenses">▤ Expenses</button>
            <button data-page="reports">▥ Reports</button>
            <hr>
            <button data-page="profile">◉ Profile</button>
            <button data-page="settings">⚙ Settings</button>
            <button id="logout-btn" class="mt-3" style="color: #fca5a5;">⇄ Logout</button>
        </nav>
        <footer>© 2026 BizKPI Dashboard</footer>
    </aside>

    <!-- Main Content Area -->
    <main>
        <header>
            <button id="menu">☰</button>
            <div>
                <b id="title">Dashboard</b>
                <small>Business Performance / <span id="crumb">Dashboard</span></small>
            </div>
            <div class="tools">
                <input type="text" id="table-search" placeholder="Search here..." style="display: none;">
                <span id="theme-toggle" style="cursor: pointer;">◐</span>
                <span style="cursor: pointer;">🔔</span>
                <strong style="font-size: 12px; color: var(--navy);">👤 {{ username }}</strong>
            </div>
        </header>
        
        <!-- App content container -->
        <section id="app"></section>
    </main>

    <!-- Dynamic Modal Backdrop for Forms -->
    <div id="modal-backdrop" class="modal-backdrop">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modal-title">Form Title</h3>
                <button id="modal-close-btn" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div id="modal-error" class="alert alert-danger py-2" style="display:none; font-size: 11px;"></div>
                <form id="modal-form">
                    <!-- Dynamic inputs injected by app.js -->
                    <div id="modal-form-fields"></div>
                </form>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel-btn" class="cancel">Cancel</button>
                <button id="modal-submit-btn" class="save" type="button">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Script loading -->
    <script>
        // Set dynamic API endpoints for app.js config
        window.API_URLS = {
            dashboard: "{{ url_for('dashboard.api_dashboard_data') }}",
            customers: "/api/customers",
            products: "/api/products",
            sales: "/api/sales",
            expenses: "/api/expenses",
            reports: "/api/reports",
            profile: "/api/auth/profile",
            logout: "/logout"
        };
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
